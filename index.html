<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24528F">
<title>PE Fabrikation · Element-Etiketten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --blau:#24528F; --blau-tief:#173A68; --blau-hell:#E3EBF5;
  --tinte:#18212B; --stahl:#5B6673; --linie:#D3D9DF;
  --beton:#EEF1F3; --tisch:#DCE1E6; --papier:#FFFFFF;
  --gruen:#2E7D4F; --gruen-hell:#E3F2E8; --amber:#9A6412; --amber-hell:#FBF0DC; --rot:#B3261E;
  --signal:#F5B301;
  --font:"Archivo","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);color:var(--tinte);background:var(--beton);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blau)}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;border:1px solid var(--linie);background:var(--papier);color:var(--tinte);padding:.5em .95em;border-radius:6px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap;line-height:1.2}
.btn:hover{border-color:var(--blau);color:var(--blau)}
.btn:disabled{opacity:.45;cursor:not-allowed;border-color:var(--linie);color:var(--tinte)}
.btn.primary{background:var(--blau);border-color:var(--blau);color:#fff}
.btn.primary:hover{background:var(--blau-tief);border-color:var(--blau-tief);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--blau-hell);color:var(--blau)}
.btn.danger{color:var(--rot)}
.btn.danger:hover{background:#FBE9E8;color:var(--rot);border-color:transparent}
.btn.sm{padding:.32em .6em;font-size:13px}
.btn.gross{padding:.85em 1.1em;font-size:16px;width:100%}

/* Topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--papier);border-bottom:1px solid var(--linie);padding:10px 20px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.tb-links{display:flex;align-items:center;gap:18px;min-width:0}
.tb-logo{display:block;width:170px;flex:none}
.tb-logo .logo-svg,.tb-logo .logo-img{display:block;width:100%;height:auto;max-height:40px;object-fit:contain;object-position:left}
.tb-titel{font-weight:600;color:var(--stahl);border-left:1px solid var(--linie);padding-left:18px;white-space:nowrap}
.tb-rechts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}

/* Intro */
.intro{background:var(--blau);color:#fff;padding:18px 20px}
.intro-in{display:flex;gap:24px;align-items:flex-start;max-width:1500px}
.intro h2{font-size:17px;font-weight:700;margin-bottom:10px}
.intro ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;counter-reset:s}
.intro li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:8px;font-size:14px;line-height:1.4;color:#DCE6F3}
.intro li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:#fff;color:var(--blau);font-weight:800;font-size:13px;display:grid;place-items:center}
.intro li strong{color:#fff;display:block}
.intro .btn{flex:none;background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.intro .btn:hover{background:rgba(255,255,255,.12);color:#fff}
.intro-body{flex:1;min-width:0}

/* Layout */
.app{display:grid;grid-template-columns:250px minmax(0,1fr) 470px;min-height:calc(100vh - 62px)}
.seite{background:var(--papier);border-right:1px solid var(--linie);padding:18px 14px}
.seite-kopf{display:flex;align-items:center;justify-content:space-between;margin:0 4px 12px}
.seite-kopf h2{font-size:15px;font-weight:700}
.seite-akt{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ordner-liste{display:grid;gap:2px;margin:2px 0 8px 14px;padding-left:8px;border-left:2px solid var(--blau-hell)}
.ordner-item{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:6px 8px;font-size:13px;cursor:pointer;color:var(--tinte)}
.ordner-item:hover{background:var(--beton)}
.ordner-item.aktiv{background:var(--blau);color:#fff}
.ordner-item.aktiv .obj-count{background:#fff;color:var(--blau)}
.ordner-neu{background:none;border:0;color:var(--blau);font-weight:600;font-size:13px;text-align:left;padding:6px 8px;cursor:pointer}
.ordner-titel{color:var(--stahl);font-weight:700}
select.btn{appearance:auto;padding-right:.4em}
.pd-modus{font-size:13px;color:var(--stahl);display:flex;align-items:center;gap:6px}
.pd-modus select{border:1px solid var(--linie);border-radius:6px;padding:.35em .5em;background:#fff;color:var(--tinte)}
.obj-item{display:grid;grid-template-columns:1fr auto;gap:2px 8px;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:10px 10px 10px 11px;border-radius:0 6px 6px 0;cursor:pointer}
.obj-item:hover{background:var(--beton)}
.obj-item.aktiv{background:var(--blau-hell);border-left-color:var(--blau)}
.obj-name{font-weight:700;font-size:14px;line-height:1.25}
.obj-sub{grid-column:1;font-size:13px;color:var(--stahl)}
.obj-suche{width:100%;border:1px solid var(--linie);border-radius:6px;padding:.5em .7em;margin:0 0 10px;background:#fff;min-height:38px}
.obj-suche:focus{border-color:var(--blau);outline:2px solid var(--blau-hell);outline-offset:0}
.obj-frist{grid-column:1;font-size:12px;font-weight:600;color:var(--rot)}
.frist{color:var(--amber)}
.frist.bald{color:var(--rot)}
.obj-count{grid-row:1/3;grid-column:2;align-self:center;font-size:12px;font-weight:700;color:var(--stahl);background:var(--beton);border-radius:10px;padding:1px 8px}
.obj-item.aktiv .obj-count{background:#fff;color:var(--blau)}
main{padding:26px 30px 60px;min-width:0}
.vorschau{background:var(--tisch);border-left:1px solid var(--linie)}
.vorschau-inner{position:sticky;top:0;padding:24px 26px}

/* Objekt */
.obj-kopf{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding-bottom:22px;border-bottom:1px solid var(--linie);margin-bottom:26px}
.obj-kopf h1{font-size:30px;font-weight:800;letter-spacing:-.01em;margin-bottom:14px}
.obj-daten{display:flex;flex-wrap:wrap;gap:10px 32px;margin:0}
.obj-daten dt{font-size:12px;color:var(--stahl);font-weight:500}
.obj-daten dd{margin:0;font-weight:600}
.block{margin-bottom:34px}
.block-kopf{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.block-kopf h2{font-size:19px;font-weight:700}
.block-kopf p{margin:4px 0 0;color:var(--stahl);font-size:14px}
.block-aktionen{display:flex;gap:8px;flex-wrap:wrap}
.zahl{display:inline-block;font-size:13px;font-weight:700;color:var(--stahl);background:var(--papier);border:1px solid var(--linie);border-radius:10px;padding:0 8px;vertical-align:3px;margin-left:4px}

/* Pläne */
.plan-spalten{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:14px}
.plan-upload{display:flex;gap:8px;flex-wrap:wrap}
.plan-alle{margin-top:14px}
.plan-alle summary{cursor:pointer;font-weight:600;color:var(--blau);font-size:14px}
.plan-spalte{background:var(--papier);border:1px solid var(--linie);border-radius:8px;padding:14px 14px 8px}
.plan-titel{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.plan-titel h3{font-size:15px;font-weight:700}
.plan-liste{list-style:none;margin:0;padding:0}
.plan-liste li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:2px 10px;align-items:center;padding:10px 0 6px;border-top:1px solid var(--beton)}
.pdf-ico{width:30px;height:36px;border:1.5px solid var(--rot);color:var(--rot);font-size:9px;font-weight:800;display:grid;place-items:end center;padding-bottom:4px;border-radius:2px 8px 2px 2px}
.plan-name{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.plan-name small{display:block;font-weight:400;color:var(--stahl);font-size:12px}
.plan-akt{grid-column:2;display:flex;flex-wrap:wrap;margin-left:-.6em}
.leer{color:var(--stahl);font-size:14px;margin:6px 0 10px}

/* Tabelle */
.tab-wrap{overflow-x:auto;background:var(--papier);border:1px solid var(--linie);border-radius:8px}
.el-tab{width:100%;border-collapse:collapse;font-size:14px}
.el-tab th{text-align:left;font-weight:600;font-size:12px;color:var(--stahl);padding:10px 12px;border-bottom:1px solid var(--linie);white-space:nowrap}
.el-tab td{padding:10px 12px;border-bottom:1px solid var(--beton);vertical-align:middle}
.el-tab tbody tr{cursor:pointer}
.el-tab tbody tr:hover{background:#F6F8FA}
.el-tab tbody tr.aktiv{background:var(--blau-hell)}
.el-tab tbody tr.aktiv td:first-child{box-shadow:inset 3px 0 0 var(--blau)}
.el-tab tbody tr:last-child td{border-bottom:0}
.el-tab td small{display:block;color:var(--stahl);font-size:12px}
.c-chk{width:36px}
.c-chk input{width:17px;height:17px;accent-color:var(--blau)}
.c-pos,.c-plaene{font-weight:700;white-space:nowrap}
.c-akt{text-align:right;white-space:nowrap}
.plan-tag{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:4px;font-size:11px;font-weight:800;margin-right:4px}
.plan-tag.ok{background:var(--blau);color:#fff}
.plan-tag.fehlt{border:1.5px dashed #AEB6BF;color:#AEB6BF}
.pz{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:5px;font-size:12px;font-weight:800;margin-right:4px;cursor:pointer;border:1.5px dashed #AEB6BF;color:#8C96A1;background:#fff}
.pz:hover,.pz.drop{border-color:var(--blau);color:var(--blau);background:var(--blau-hell)}
.pz.ok{background:var(--blau);border:1.5px solid var(--blau);color:#fff}
.pz.laedt{background:var(--amber-hell);border:1.5px solid var(--signal);color:var(--amber)}
.pz.kaputt{background:#FBE9E8;color:var(--rot);border:1.5px solid var(--rot)}
.anz{width:58px;border:1px solid var(--linie);border-radius:6px;padding:.3em .4em;text-align:center}
.c-ba{font-variant-numeric:tabular-nums;white-space:nowrap}
.el-tab td:nth-child(3){min-width:210px}
.vs-plaene{margin-top:18px}
.vs-plaene h3{font-size:14px;font-weight:700;margin-bottom:6px}
.vs-plan{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--linie);font-size:13px}
.vs-plan strong{flex:none;width:96px}
.vs-plan span{flex:1;min-width:0;overflow-wrap:anywhere;color:var(--stahl)}
.zu-tab{width:100%;border-collapse:collapse;font-size:13px}
.zu-tab th{text-align:left;color:var(--stahl);font-weight:600;padding:6px;border-bottom:1px solid var(--linie)}
.zu-tab td{padding:6px;border-bottom:1px solid var(--beton);vertical-align:middle}
.zu-tab td:first-child{overflow-wrap:anywhere;max-width:340px}
.zu-tab select{width:100%;border:1px solid var(--linie);border-radius:6px;padding:.35em .5em;background:#fff}
.zu-ok{color:var(--gruen);font-weight:700}
.zu-pruefen{color:var(--amber);font-weight:700}
.zu-nein{color:var(--rot);font-weight:700}
dialog.breit{width:min(1000px,calc(100vw - 24px))}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:10px;white-space:nowrap}
.st-geplant{background:var(--beton);color:var(--stahl)}
.st-produziert{background:var(--blau-hell);color:var(--blau)}
.st-geliefert{background:var(--amber-hell);color:var(--amber)}
.st-montiert{background:var(--gruen-hell);color:var(--gruen)}
.leer-gross{background:var(--papier);border:1.5px dashed var(--linie);border-radius:10px;padding:48px 24px;text-align:center}
.leer-gross h2{font-size:20px;margin-bottom:6px}
.leer-gross p{color:var(--stahl);margin:0 0 18px}

/* Vorschau */
.vs-kopf{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px}
.vs-titel{font-size:17px;font-weight:700}
.vs-mass{font-size:12px;color:var(--stahl)}
.skala-rahmen{position:relative;overflow:hidden;padding:0 12px 16px 0;margin-right:-12px}
.skala{transform-origin:top left;width:max-content}
.mass{display:grid;grid-template-columns:24px 100mm;grid-template-rows:24px 100mm}
.mass-h,.mass-v{position:relative;color:var(--stahl);font-size:11px}
.mass-h{grid-column:2;grid-row:1;border-left:1px solid var(--stahl);border-right:1px solid var(--stahl);margin-bottom:8px}
.mass-h::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid var(--stahl)}
.mass-h span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--tisch);padding:0 6px}
.mass-v{grid-column:1;grid-row:2;border-top:1px solid var(--stahl);border-bottom:1px solid var(--stahl);margin-right:8px}
.mass-v::before{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:1px solid var(--stahl)}
.mass-v span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg);background:var(--tisch);padding:0 6px;white-space:nowrap}
.mass .etikette{grid-column:2;grid-row:2;box-shadow:0 1px 2px rgba(20,35,55,.18),0 10px 28px rgba(20,35,55,.16)}
.vs-link{margin:18px 0 6px;font-size:13px}
.vs-link span{display:block;color:var(--stahl);margin-bottom:2px}
.link-text{display:block;word-break:break-all;font-size:12px;line-height:1.35;max-height:3.9em;overflow:hidden}
.hinweis{font-size:13px;color:var(--amber);background:var(--amber-hell);border-radius:6px;padding:8px 10px;margin:8px 0 0}
.vs-aktionen{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.vs-fotos{margin-top:20px}
.vs-fotos h3{font-size:14px;font-weight:700;margin-bottom:8px}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;display:block;background:#fff}

/* Etikette: Grösse, Ränder, Schrift, QR und Barcode kommen aus den Layout-Einstellungen (applyLayout, <style id="etLayout">) */
.etikette{--s:1;position:relative;width:100mm;height:100mm;background:#fff;color:#000;font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;padding:27mm 5mm 4.5mm;display:flex;flex-direction:column;overflow:hidden}
.et-vordruck{position:absolute;left:0;right:0;top:0;border-bottom:1px dashed #9AA6B2;background:repeating-linear-gradient(45deg,#F3F5F7 0 6px,#fff 6px 12px);color:#7A8794;font:600 8pt Arial,sans-serif;display:grid;place-items:center}
.et-logo{margin-bottom:3.5mm;flex:none}
.et-logo .logo-svg{display:block;width:100%;height:auto}
.et-logo .logo-img{display:block;max-width:100%;max-height:19mm;object-fit:contain;object-position:left}
.et-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 29mm;grid-template-rows:1fr auto;column-gap:3mm}
.et-text{grid-column:1;grid-row:1;min-height:0;overflow:hidden}
.et-titel{font-weight:700;font-size:calc(12.5pt * var(--s));line-height:1.15;margin-bottom:1.2mm}
.et-zeile{font-size:calc(11pt * var(--s));line-height:1.22}
.et-lief{font-size:calc(9.5pt * var(--s));margin-top:1.6mm}
.et-lief b{font-size:calc(10.5pt * var(--s))}
.et-elem{font-weight:700;font-size:calc(11.5pt * var(--s));margin-top:1.4mm;line-height:1.18}
.et-gewerk{font-weight:700;font-size:calc(10.5pt * var(--s));margin-top:.8mm;line-height:1.18}
.et-bar{grid-column:1;grid-row:2;margin-top:2mm;width:46mm}
.et-bar svg{display:block;width:100%;height:8mm}
.et-bar-nr{font-size:8pt;letter-spacing:.06em;text-align:center;margin-top:.4mm;font-variant-numeric:tabular-nums}
.et-qr{grid-column:2;grid-row:1/3;align-self:end;text-align:center}
.et-qr img,.qr-fehlt{display:block;width:29mm;height:29mm}
.qr-fehlt{border:1px dashed #999;display:grid;place-items:center;font-size:8pt;color:#666}
.et-qr span{display:block;font-size:6.5pt;line-height:1.1;margin-top:1mm;color:#222}

/* Layout-Dialog */
.lay{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:start}
.lay-felder{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.lay-felder h3{grid-column:1/-1;font-size:13px;color:var(--stahl);margin:6px 0 -2px}
.lay-vorschau{background:var(--tisch);border-radius:8px;padding:14px;overflow:hidden}
.lay-vorschau .etikette{box-shadow:0 1px 2px rgba(20,35,55,.18),0 8px 22px rgba(20,35,55,.16);transform-origin:top left}

/* Fotos: Galerie und Grossansicht */
.galerie h3{font-size:15px;margin:14px 0 8px}
.galerie h3:first-child{margin-top:0}
.gal-raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.gal-raster button{padding:0;border:0;background:var(--tisch);border-radius:6px;overflow:hidden;cursor:zoom-in;aspect-ratio:4/3}
.gal-raster img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs img{cursor:zoom-in}
.c-fotos button{min-width:34px}
#lb{width:100vw;height:100vh;max-width:none;max-height:none;margin:0;border-radius:0;background:rgba(10,16,24,.94);color:#fff;padding:0}
#lb::backdrop{background:rgba(10,16,24,.94)}
.lb{position:absolute;inset:0;display:grid;grid-template-rows:auto 1fr auto}
.lb-kopf{display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:14px}
.lb-kopf .spacer{flex:1}
.lb-bild{min-height:0;display:grid;place-items:center;padding:0 60px}
.lb-bild img{max-width:100%;max-height:calc(100vh - 130px);object-fit:contain;border-radius:4px}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:64px;border:0;border-radius:8px;background:rgba(255,255,255,.12);color:#fff;font-size:28px;cursor:pointer}
.lb-nav:hover{background:rgba(255,255,255,.25)}
.lb-nav.l{left:8px}.lb-nav.r{right:8px}
.lb .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3);color:#fff}
.lb-fuss{padding:10px 16px;font-size:13px;color:#C9D3DE;text-align:center}

/* Foto-Code in der Monteur-Ansicht */
.code-box{display:flex;gap:10px;align-items:flex-end}
.code-box .feld{flex:1}

/* Dialog */
dialog{border:0;border-radius:10px;padding:0;width:min(620px,calc(100vw - 24px));max-height:calc(100vh - 40px);box-shadow:0 24px 60px rgba(10,25,45,.3);color:var(--tinte)}
dialog::backdrop{background:rgba(18,30,45,.45)}
.dlg-form{display:flex;flex-direction:column;max-height:calc(100vh - 40px)}
.dlg-form h2{font-size:19px;font-weight:700;padding:20px 22px 0}
.dlg-body{padding:16px 22px;overflow-y:auto}
.dlg-body p{margin:0 0 8px}
.dlg-fuss{display:flex;gap:8px;padding:14px 22px;border-top:1px solid var(--linie);background:#F8FAFB}
.spacer{flex:1}
.feld-gitter{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.feld{display:flex;flex-direction:column;gap:5px}
.feld.voll{grid-column:1/-1}
.feld>span{font-size:13px;font-weight:600;color:var(--stahl)}
.feld input:not([type=checkbox]),.feld select{border:1px solid var(--linie);border-radius:6px;padding:.55em .7em;background:#fff;width:100%;min-height:40px}
.feld input:focus,.feld select:focus{border-color:var(--blau);outline:2px solid var(--blau-hell);outline-offset:0}

.sync{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--stahl);padding:0 10px;white-space:nowrap}
.sync::before{content:"";width:9px;height:9px;border-radius:50%;background:#AEB6BF;flex:none}
.sync.live::before{background:var(--gruen)}
.sync.pending::before{background:var(--signal)}
.sync.offline::before{background:var(--rot)}
.sync:empty{display:none}
.banner{background:#FBE9E8;color:var(--rot);padding:10px 20px;font-weight:600;font-size:14px}
.tb-rechts{align-items:center}
.sc-kopf{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sc-kopf .sync{padding:0}
.plan-tag.kaputt{background:#FBE9E8;color:var(--rot);border:1.5px solid var(--rot)}
.pk-status{display:block;font-size:13px;color:var(--stahl);margin-top:2px}
.pk-status.fehler{color:var(--rot)}
.pk-balken{height:4px;background:var(--beton);border-radius:2px;margin-top:8px;overflow:hidden;width:100%}
.pk-balken i{display:block;height:100%;background:var(--blau);width:0;transition:width .2s}
.pk{flex-direction:column;align-items:stretch;flex-wrap:nowrap;text-align:left}

.pk-akt{flex-wrap:wrap;justify-content:flex-start;align-self:stretch}
.pk-akt .btn{flex:0 1 auto}
.zw-liste{display:grid;gap:4px;max-height:50vh;overflow:auto;border:1px solid var(--linie);border-radius:6px;padding:6px}
.zw-liste label{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:4px;font-size:14px}
.zw-liste label:hover{background:var(--beton)}
.zw-liste input{width:18px;height:18px;accent-color:var(--blau)}
.zw-liste small{color:var(--stahl)}
.sc-h3{font-size:15px;font-weight:700;margin:18px 0 10px;color:var(--stahl)}
.pk.klein{padding:10px 12px}
.pk.klein .pk-text strong{font-size:15px}
/* Toast */
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--tinte);color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100vw - 32px)}
#toast.an{opacity:1;transform:translate(-50%,0)}

/* Produktion: Barcode scannen, Produktionsplan anzeigen */
body.modus-prod #admin,body.modus-prod #scan{display:none}
body:not(.modus-prod) #produktion{display:none}
.pd{display:flex;flex-direction:column;height:100vh}
.pd-kopf{display:flex;align-items:center;gap:18px;background:#fff;border-bottom:1px solid var(--linie);padding:10px 20px}
.pd-kopf .tb-logo{width:150px}
.pd-kopf h1{font-size:18px;font-weight:700;flex:1}
.pd-form{display:flex;gap:10px;padding:14px 20px;background:var(--blau)}
.pd-form input{flex:1;max-width:520px;font-size:24px;font-weight:700;letter-spacing:.04em;padding:.35em .6em;border:3px solid #fff;border-radius:8px;font-variant-numeric:tabular-nums}
.pd-form input:focus{outline:4px solid var(--signal);outline-offset:0}

.sc{max-width:600px;margin:0 auto;min-height:100vh;background:var(--beton)}

.sc-held .chip{font-size:13px}

.pk-akt{display:flex;gap:8px}

.pk.leer{display:block;border-style:dashed;background:transparent}

.sc-zwei{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.foto-raster{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.foto{margin:0;background:#fff;border:1px solid var(--linie);border-radius:8px;overflow:hidden}
.foto img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--tisch)}

.sc-info{font-size:13px;color:var(--stahl);background:#fff;border-left:3px solid var(--signal);padding:10px 12px;margin:14px 18px 0}
.sc-fuss{padding:26px 18px 40px;text-align:center}

.sc-fehler{padding:40px 22px;text-align:center}

/* Responsive */
@media (max-width:1320px){
  .app{grid-template-columns:230px minmax(0,1fr)}

}

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { initializeFirestore, getFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, onSnapshot, setDoc, updateDoc, deleteDoc, getDoc, arrayUnion, arrayRemove } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

import { getStorage, ref as sRef, uploadBytesResumable, getBlob, deleteObject } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js';
window.__peStart=true;

/* ---------- Firebase ---------- */
const firebaseConfig={
  apiKey:"AIzaSyCKi53XKYTVJSUIdl3XznA81Xw1QMi6kVY",
  authDomain:"etikette-fa8d1.firebaseapp.com",
  projectId:"etikette-fa8d1",
  storageBucket:"etikette-fa8d1.firebasestorage.app",
  messagingSenderId:"531023347322",
  appId:"1:531023347322:web:6579252872d53b199a85c3"
};
const fbApp=initializeApp(firebaseConfig);
let fs;
try{ fs=initializeFirestore(fbApp,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})}); }
catch(err){ console.warn('Offline-Cache nicht verfügbar:',err); fs=getFirestore(fbApp); }
const ref=(c,id)=>doc(fs,c,id);
const st=getStorage(fbApp);

/* ---------- Helfer ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const h=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>{ if(!d) return '–'; const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d); return m?`${m[3]}.${m[2]}.${m[1]}`:d; };
const fmtTs=ts=>new Date(ts).toLocaleString('de-CH',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const kb=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
const debounce=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};};
// Reihenfolge wie im Enventa-Auftrag (Positions-Nr.), sonst nach Position
const byPos=(a,b)=>(Number(a.fixpos)||1e9)-(Number(b.fixpos)||1e9)||String(a.pos||'').localeCompare(String(b.pos||''),'de',{numeric:true});
const plain=o=>JSON.parse(JSON.stringify(o));
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('an'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('an'),2800); }
function clean(d){ const o={}; for(const [k,v] of Object.entries(d)) if(typeof v==='string') o[k]=v.trim(); return o; }
function fire(p){ p.catch(err=>{ console.error(err); toast('Speichern fehlgeschlagen: '+(err.code||err.message)); }); return p; }
const LS={
  get(k,d=null){ try{ const v=localStorage.getItem('pe-et-'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('pe-et-'+k,JSON.stringify(v)); }catch(e){} }
};

/* ---------- Lokaler Datei-Cache (IndexedDB) ---------- */
const DB={
  db:null, mem:new Map(),
  async open(){
    try{
      this.db=await new Promise((res,rej)=>{
        const r=indexedDB.open('pe-etiketten-cache',1);
        r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains('files')) r.result.createObjectStore('files',{keyPath:'id'}); };
        r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); r.onblocked=()=>rej(new Error('blockiert'));
      });
    }catch(e){ console.warn('Datei-Cache nur im Arbeitsspeicher:',e); this.db=null; }
  },
  req(mode,fn){ return new Promise((res,rej)=>{ const t=this.db.transaction('files',mode); const q=fn(t.objectStore('files')); t.oncomplete=()=>res(q?q.result:undefined); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); },
  get(id){ return this.db?this.req('readonly',s=>s.get(id)):Promise.resolve(this.mem.get(id)); },
  put(o){ if(!this.db){ this.mem.set(o.id,o); return Promise.resolve(); } return this.req('readwrite',s=>s.put(o)); },
  del(id){ if(!this.db){ this.mem.delete(id); return Promise.resolve(); } return this.req('readwrite',s=>s.delete(id)); }
};

/* ---------- Dateien ----------
   Zwei Speicherorte, umschaltbar in den Einstellungen (settings.speicher):
   - 'firestore' (Standard, Gratis-Tarif): base64-Teile zu 600 KB in dateien/{id}/teile, ID ohne "/"
   - 'storage' (nach Einrichtung von Blaze + Storage): Firebase Storage, die ID ist der Pfad (enthält "/")
   Gelesen werden immer beide. */
const istPfad=id=>String(id).includes('/');
const TEIL=600*1024;
function bytesToB64(u){ let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); }
function b64ToBytes(b){ const s=atob(b); const u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }
function putFile(path,name,type,buf){
  if(S.settings.speicher!=='storage') return putFileFirestore(name,type,buf);
  DB.put({id:path,name,type,data:buf}).catch(()=>{});
  const task=uploadBytesResumable(sRef(st,path),new Uint8Array(buf),{contentType:type,customMetadata:{name}});
  const done=new Promise((res,rej)=>task.on('state_changed',null,rej,()=>res()));
  fire(done);
  offeneUploads++; const fertig=()=>{ offeneUploads--; }; done.then(fertig,fertig);
  return {id:path,done};
}
function putFileFirestore(name,type,buf){
  const id=uid(); const u=new Uint8Array(buf); const n=Math.max(1,Math.ceil(u.length/TEIL)); const ps=[];
  for(let i=0;i<n;i++) ps.push(setDoc(doc(fs,'dateien',id,'teile',String(i)),{d:bytesToB64(u.subarray(i*TEIL,(i+1)*TEIL))}));
  ps.push(setDoc(ref('dateien',id),{name,type,size:u.length,chunks:n,created:Date.now()}));
  DB.put({id,name,type,data:buf}).catch(()=>{});
  const done=Promise.all(ps); fire(done);
  offeneUploads++; const fertig=()=>{ offeneUploads--; }; done.then(fertig,fertig);
  return {id,done};
}
const ladeLaeuft=new Map();
const DATEI_FEHLER=new Map();
function mitTimeout(p,ms){ return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('Zeitüberschreitung')),ms))]); }
function meldeFortschritt(id,fertig,total){ document.dispatchEvent(new CustomEvent('datei-fortschritt',{detail:{id,fertig,total}})); }
let offeneUploads=0;
window.addEventListener('beforeunload',ev=>{ if(offeneUploads>0){ ev.preventDefault(); ev.returnValue=''; } });
function getFile(id){
  if(!id) return Promise.resolve(null);
  if(ladeLaeuft.has(id)) return ladeLaeuft.get(id);
  const p=(async()=>{
    const c=await DB.get(id).catch(()=>null); if(c) return c;
    if(istPfad(id)){
      try{
        const b=await mitTimeout(getBlob(sRef(st,id)),180000);
        const f={id,name:id.split('/').pop(),type:b.type,data:await b.arrayBuffer()}; DB.put(f).catch(()=>{}); return f;
      }catch(err){ console.warn('Datei nicht ladbar',id,err); DATEI_FEHLER.set(id,err&&err.code==='storage/object-not-found'?'fehlt':'netz'); return null; }
    }
    try{
      const m=await mitTimeout(getDoc(ref('dateien',id)),45000); if(!m.exists()){ DATEI_FEHLER.set(id,'fehlt'); return null; }
      const md=m.data(); const n=md.chunks||1; let fertig=0;
      meldeFortschritt(id,0,n);
      const teile=await Promise.all(Array.from({length:n},(_,i)=>mitTimeout(getDoc(doc(fs,'dateien',id,'teile',String(i))),120000).then(t=>{ meldeFortschritt(id,++fertig,n); return t; })));
      if(teile.some(t=>!t.exists())){ DATEI_FEHLER.set(id,'unvollstaendig'); return null; }
      const parts=teile.map(t=>b64ToBytes(t.data().d)); const total=parts.reduce((a,x)=>a+x.length,0);
      const u=new Uint8Array(total); let o=0; parts.forEach(x=>{ u.set(x,o); o+=x.length; });
      const f={id,name:md.name,type:md.type,data:u.buffer}; DB.put(f).catch(()=>{}); return f;
    }catch(err){ console.warn('Datei nicht ladbar',id,err); DATEI_FEHLER.set(id,'netz'); return null; }
  })();
  ladeLaeuft.set(id,p); p.finally(()=>ladeLaeuft.delete(id));
  return p;
}
async function delFile(id){
  if(!id) return; DB.del(id).catch(()=>{});
  if(istPfad(id)){ deleteObject(sRef(st,id)).catch(err=>{ if(err.code!=='storage/object-not-found') console.warn('Löschen fehlgeschlagen',id,err); }); return; }
  let n=1; try{ const m=await getDoc(ref('dateien',id)); if(m.exists()) n=m.data().chunks||1; }catch(e){}
  fire(deleteDoc(ref('dateien',id)));
  for(let i=0;i<n;i++) fire(deleteDoc(doc(fs,'dateien',id,'teile',String(i))));
}

/* ---------- Zustand ---------- */
const S={objekte:[],plaene:[],elemente:[],settings:{},aktivObjekt:null,aktivOrdner:'*',aktivElement:null,auswahl:new Set(),scanElement:null,gestartet:false};
const obj=id=>S.objekte.find(o=>o.id===id);
const plan=id=>id?S.plaene.find(p=>p.id===id):null;
const elem=id=>S.elemente.find(e=>e.id===id);
const elementeVon=oid=>S.elemente.filter(e=>e.objektId===oid).sort(byPos);
// Unterordner: '*' = alle, '-' = ohne Unterordner, sonst die Ordner-ID
const imOrdner=(e,ord)=>ord==='*'||(ord==='-'?!e.ordnerId:e.ordnerId===ord);
const elementeImBlick=o=>elementeVon(o.id).filter(e=>imOrdner(e,S.aktivOrdner));
// Element-Zeile wie auf der Etikette: die Bezeichnung aus Enventa, die Nasszelle davor nur wenn sie fehlt
const elText=e=>{ const b=String(e.bezeichnung||'').trim(); return e.pos&&!norm(b).includes(norm(e.pos))?`${e.pos} ${b}`.trim():(b||e.pos||e.barcode||''); };
const ersteObjektId=()=>{ const f=[...S.objekte].sort((a,b)=>(a.created||0)-(b.created||0))[0]; return f?f.id:null; };
const lief=e=>{ const o=obj(e.objektId)||{}; return e.lieferdatum||o.lieferdatum||''; };
function upsert(arr,x){ const i=arr.findIndex(y=>y.id===x.id); if(i<0) arr.push(x); else arr[i]=x; }
function saveObj(o){ upsert(S.objekte,o); fire(setDoc(ref('objekte',o.id),plain(o))); }
function savePlan(p){ upsert(S.plaene,p); fire(setDoc(ref('plaene',p.id),plain(p))); }
function saveElem(e){ upsert(S.elemente,e); fire(setDoc(ref('elemente',e.id),plain(e))); }
function patch(coll,id,fields){ const x=S[coll].find(y=>y.id===id); if(x) Object.assign(x,fields); fire(updateDoc(ref(coll,id),plain(fields))); }
function entferne(coll,id){ S[coll]=S[coll].filter(x=>x.id!==id); fire(deleteDoc(ref(coll,id))); }
function saveSettings(fields){ Object.assign(S.settings,fields); fire(setDoc(ref('settings','app'),plain(fields),{merge:true})); }

/* ---------- Enventa: Auftragsnr. + Position ergeben feste IDs ---------- */
// "NZ 41.03" und "nz41.03" ergeben denselben Schlüssel, damit Etikette und Dateiname zusammenpassen.
const schluessel=x=>String(x||'').trim().toUpperCase().replace(/[^A-Z0-9.-]/g,'');
const objektIdFuer=a=>'a_'+schluessel(a);
const elementIdFuer=(a,p)=>objektIdFuer(a)+'_'+schluessel(p);
const elemVorgabe=()=>({bezeichnung:'',gewerk:'',geschoss:'',lieferdatum:'',barcode:'',montagePlanId:'',detailPlanId:'',produktionPlanId:'',anzahl:1,status:'geplant',fotos:[],montiert:null});
// Nur die bekannten Felder mit merge schreiben: Ist der lokale Cache veraltet und das Dokument existiert schon, gehen Pläne, Status und Fotos nicht verloren.
function anlegen(coll,x,vorgabe){ upsert(S[coll],{...vorgabe,...x}); fire(setDoc(ref(coll,x.id),plain(x),{merge:true})); }
function findeObjekt(a){ const k=schluessel(a); return obj(objektIdFuer(a))||S.objekte.find(o=>schluessel(o.auftragNr)===k)||null; }
function findeEnventa(a,p){
  const e=elem(elementIdFuer(a,p)); if(e) return e;
  const ka=schluessel(a), kp=schluessel(p);
  const os=new Set(S.objekte.filter(o=>schluessel(o.auftragNr)===ka).map(o=>o.id));
  return S.elemente.find(x=>os.has(x.objektId)&&schluessel(x.pos)===kp)||null;
}
function enventaObjekt(a,x={}){
  const vorh=findeObjekt(a); if(vorh) return vorh;
  const o={id:objektIdFuer(a),name:String(x.o||'').trim()||'Auftrag '+a.trim(),auftragNr:a.trim(),created:Date.now()};
  if(x.k) o.kunde=String(x.k).trim();
  anlegen('objekte',o,{kunde:'',strasse:'',plzOrt:'',lieferdatum:''});
  return obj(o.id);
}
function enventaElement(a,p,x={},o=null,felder={}){
  const vorh=findeEnventa(a,p); if(vorh) return vorh;
  const ob=o||enventaObjekt(a,x);
  const e={id:elementIdFuer(a,p),objektId:ob.id,pos:p.trim(),created:Date.now(),...felder};
  for(const [k,f] of [['b','bezeichnung'],['g','gewerk'],['e','geschoss']]) if(x[k]) e[f]=String(x[k]).trim();
  anlegen('elemente',e,elemVorgabe());
  return elem(e.id);
}

/* ---------- Live-Synchronisation ---------- */
const bereit={objekte:false,plaene:false,elemente:false,settings:false};
const meta={};
let zugriffFehler=false, authFehler=null, angemeldet=false;
function syncStatus(){
  const m=Object.values(meta);
  let cls='live', txt='Live verbunden';
  if(zugriffFehler){ $$('.sync').forEach(el=>{ el.className='sync offline'; el.textContent='Kein Zugriff'; }); return; }
  if(!navigator.onLine||m.some(x=>x.fromCache)){ cls='offline'; txt='Offline, wird später synchronisiert'; }
  else if(m.some(x=>x.hasPendingWrites)){ cls='pending'; txt='Wird gespeichert'; }
  $$('.sync').forEach(el=>{ el.className='sync '+cls; el.textContent=txt; });
}
function syncFehler(err){
  console.error(err);
  const b=$('#banner'); b.hidden=false;
  if(err&&err.code==='permission-denied'){
    zugriffFehler=true;
    b.textContent=authFehler
      ?`Kein Zugriff: Die anonyme Anmeldung ist fehlgeschlagen (${authFehler}). In der Firebase-Konsole unter Authentication → Anmeldemethode "Anonym" aktivieren und die Domain unter Einstellungen → Autorisierte Domains eintragen.`
      :(angemeldet?'Kein Zugriff trotz Anmeldung. Bitte die Firestore-Regeln in der Firebase-Konsole prüfen.'
                  :'Kein Zugriff: Anmeldung noch nicht abgeschlossen. Seite neu laden.');
  }else b.textContent='Verbindung zur Datenbank fehlgeschlagen: '+(err&&(err.code||err.message));
  syncStatus();
}
function fehlerZurueck(){ zugriffFehler=false; const b=$('#banner'); b.hidden=true; b.textContent=''; }
let abmelden=[];
function starteListener(){
  abmelden.forEach(u=>{ try{ u(); }catch(e){} }); abmelden=[];
  for(const name of ['objekte','plaene','elemente']){
    abmelden.push(onSnapshot(collection(fs,name),{includeMetadataChanges:true},snap=>{
      if(zugriffFehler) fehlerZurueck();
      meta[name]=snap.metadata; syncStatus();
      const geaendert=snap.docChanges().length>0;
      if(geaendert||!bereit[name]) S[name]=snap.docs.map(d=>({...d.data(),id:d.id}));
      if(!bereit[name]){ bereit[name]=true; pruefeStart(); }
      else if(geaendert) planRender();
      pruefeAufbewahrung();
    },syncFehler));
  }
  abmelden.push(onSnapshot(ref('settings','app'),{includeMetadataChanges:true},snap=>{
    meta.settings=snap.metadata; syncStatus();
    S.settings=snap.exists()?snap.data():{};
    qrCache.clear(); applyLogo(); applyLayout();
    if(!bereit.settings){ bereit.settings=true; pruefeStart(); } else planRender();
    pruefeAufbewahrung();
  },syncFehler));
}
function pruefeStart(){
  if(S.gestartet||!Object.values(bereit).every(Boolean)) return;
  S.gestartet=true; S.aktivObjekt=ersteObjektId(); applyLogo(); route();
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitSkala);
}
const planRender=debounce(()=>{
  if(!S.gestartet) return;
  if(document.body.classList.contains('modus-prod')){ syncStatus(); return; }
  if(document.body.classList.contains('modus-scan')){
    const e=elem(S.scanElement);
    if(!e){ route(); return; }
    const fokus=document.activeElement&&document.activeElement.id==='monteurName';
    const code=$('#fotoCode'), codeWert=code?code.value:'', codeFokus=document.activeElement===code&&!!code;
    renderScanElement(e);
    if(fokus){ const i=$('#monteurName'); if(i){ i.focus(); const l=i.value.length; i.setSelectionRange(l,l); } }
    const c2=$('#fotoCode'); if(c2){ c2.value=codeWert; if(codeFokus) c2.focus(); }
  }else{
    if(!obj(S.aktivObjekt)) S.aktivObjekt=ersteObjektId();
    renderAll();
  }
},90);
window.addEventListener('online',syncStatus);
window.addEventListener('offline',syncStatus);

/* ---------- QR-Link: alle Etiketten-Angaben stecken im Link ---------- */
function enc(o){ return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function dec(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; return JSON.parse(decodeURIComponent(escape(atob(s)))); }
function baseUrl(){ return (S.settings.baseUrl||location.href.split('#')[0]); }
function payloadFor(e){
  const o=obj(e.objektId)||{}; const mp=plan(e.montagePlanId), dp=plan(e.detailPlanId);
  const p={i:e.id,oi:o.id,o:o.name,k:o.kunde,s:o.strasse,p:o.plzOrt,a:o.auftragNr,d:lief(e),n:e.pos,b:e.bezeichnung,g:e.gewerk,e:e.geschoss,bc:e.barcode};
  if(mp){ p.mn=mp.name; if(mp.url) p.m=mp.url; }
  if(dp){ p.dn=dp.name; if(dp.url) p.t=dp.url; }
  Object.keys(p).forEach(k=>{ if(p[k]==null||p[k]==='') delete p[k]; });
  return p;
}
// Kurzer Link mit dem Betriebsauftrag (= Barcode): #b=2026102735. Ältere Formate #a= und #e= bleiben lesbar.
function hashFor(e){
  const o=obj(e.objektId)||{};
  if(e.barcode) return 'b='+encodeURIComponent(e.barcode);
  if(schluessel(o.auftragNr)&&schluessel(e.pos)) return 'a='+encodeURIComponent(o.auftragNr)+'&p='+encodeURIComponent(e.pos)+(o.name?'&o='+encodeURIComponent(o.name):'');
  return 'e='+enc(payloadFor(e));
}
const linkFor=e=>baseUrl()+'#'+hashFor(e);

const qrCache=new Map();
function qrData(text){
  if(qrCache.has(text)) return qrCache.get(text);
  if(typeof QRious==='undefined') return null;
  try{ const d=new QRious({value:text,size:520,level:text.length<200?'M':'L',padding:12,background:'#ffffff',foreground:'#000000'}).toDataURL('image/png'); qrCache.set(text,d); return d; }
  catch(err){ console.warn('QR-Fehler',err); return null; }
}
function barcodeSvg(code){
  if(!code||typeof JsBarcode==='undefined') return '';
  try{
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    JsBarcode(svg,String(code),{format:'CODE128',displayValue:false,height:60,width:2,margin:0,background:'#ffffff',lineColor:'#000000'});
    const w=parseFloat(svg.getAttribute('width')), hh=parseFloat(svg.getAttribute('height'));
    if(w&&hh) svg.setAttribute('viewBox',`0 0 ${w} ${hh}`);
    svg.removeAttribute('width'); svg.removeAttribute('height'); svg.removeAttribute('style');
    svg.setAttribute('preserveAspectRatio','none');
    return svg.outerHTML;
  }catch(err){ console.warn('Barcode-Fehler',err); return ''; }
}

// Suche: Objektname, Kunde, Auftragsnr., Unterordner, Betriebsauftrag oder Bezeichnung eines Elements
function objektPasst(o){

}

/* ---------- Aufbewahrung: Objekte werden X Monate nach dem Anlegen automatisch gelöscht ----------
   Standard 3 Monate (Einstellungen, 0 = nie). «Behalten» verschiebt die Frist (behaltenBis).
   Gelöscht wird nur in der Büro-Ansicht und erst, wenn alle Daten frisch vom Server da sind (nicht aus dem Offline-Cache). */
const aufbewahrMonate=()=>{ const n=parseInt(S.settings.aufbewahrung,10); return isFinite(n)&&n>=0?n:3; };
const plusMonate=(ts,m)=>{ const d=new Date(ts); d.setMonth(d.getMonth()+m); return d.getTime(); };
function loeschDatum(o){
  if(o.behaltenBis) return o.behaltenBis;
  const m=aufbewahrMonate(); if(!m||!o.created) return null;
  return plusMonate(o.created,m);
}
function restTage(o){ const d=loeschDatum(o); return d==null?null:Math.max(0,Math.ceil((d-Date.now())/864e5)); }
const fmtDatum=ts=>new Date(ts).toLocaleDateString('de-CH',{day:'2-digit',month:'2-digit',year:'numeric'});
let aufbewahrungGeprueft=false;
function pruefeAufbewahrung(){
  if(aufbewahrungGeprueft||!S.gestartet||!navigator.onLine) return;
  if(document.body.classList.contains('modus-scan')||document.body.classList.contains('modus-prod')) return;
  if(!['objekte','elemente','plaene','settings'].every(k=>meta[k]&&!meta[k].fromCache)) return;
  aufbewahrungGeprueft=true;
  const alt=S.objekte.filter(o=>{ const d=loeschDatum(o); return d!=null&&d<Date.now(); });
  if(!alt.length) return;
  alt.forEach(objektLoeschen);
  if(!obj(S.aktivObjekt)){ S.aktivObjekt=ersteObjektId(); S.aktivOrdner='*'; S.aktivElement=null; }
  renderAll();
  toast(`${alt.length} Objekt${alt.length>1?'e':''} nach Ablauf der Aufbewahrungsfrist gelöscht: ${alt.map(o=>o.name).join(', ')}`);
}
function ordnerListe(o){
  const ord=o.ordner||[]; const els=S.elemente.filter(e=>e.objektId===o.id);
  const zahl=id=>els.filter(e=>imOrdner(e,id)).length;
  const knopf=(id,name)=>`<button class="ordner-item${S.aktivOrdner===id?' aktiv':''}" data-ordner="${id}"><span>${h(name)}</span><span class="obj-count">${zahl(id)}</span></button>`;
  return `<div class="ordner-liste">${ord.length?knopf('*','Alle Elemente')+ord.map(x=>knopf(x.id,x.name)).join('')+(zahl('-')?knopf('-','Ohne Unterordner'):''):''}

}

        <span class="plan-name" title="${h(p.name)}">${h(p.name)}<small>${h(info)}</small></span>

// Plan-Feld in der Tabelle: Klick lädt ein PDF hoch, man kann die Datei auch darauf ziehen
function planZelle(e,art){
  const id=e[feldVon(art)], p=plan(id), k=KURZ[art], t=ARTEN[art];
  const cls=p?(p.fertig===false?'laedt':'ok'):(id?'kaputt':'');

function dialog(title,bodyHTML,{ok='Speichern',danger=null,breit=false,info=false}={}){
  return new Promise(res=>{
    const d=$('#dlg'); d.classList.toggle('breit',breit);
    d.innerHTML=`<form class="dlg-form" novalidate><h2>${h(title)}</h2><div class="dlg-body">${bodyHTML}</div>
      <div class="dlg-fuss">${danger?`<button type="button" class="btn danger" data-danger>${h(danger)}</button>`:''}<span class="spacer"></span>
      <button type="button" class="btn" data-cancel ${info?'hidden':''}>Abbrechen</button><button type="submit" class="btn primary">${h(ok)}</button></div></form>`;
    const f=$('form',d); let done=false;
    const fin=v=>{ if(done) return; done=true; if(d.open) d.close(); res(v); };
    f.onsubmit=ev=>{ ev.preventDefault(); if(!f.reportValidity()) return; fin({action:'ok',data:Object.fromEntries(new FormData(f)),form:f}); };
    $('[data-cancel]',f).onclick=()=>fin(null);
    const dz=$('[data-danger]',f); if(dz) dz.onclick=()=>fin({action:'danger'});
    d.oncancel=()=>fin(null); d.onclose=()=>{ if(!d.open) fin(null); };
    d.showModal();
    const first=$('input:not([type=hidden]):not([type=file]),select',f); if(first) first.focus();
  });
}

function pdfPruefen(f){
  if(!f) return false;
  if(!/pdf$/i.test(f.type)&&!/\.pdf$/i.test(f.name)){ toast(`${f.name} ist kein PDF`); return false; }
  if(f.size>25*1048576){ toast(`${f.name} ist grösser als 25 MB`); return false; }
  return true;
}

async function formPlaene(form,d,e){

// Ein PDF als Montage-, Detail- oder Produktionsplan eines Elements speichern (ersetzt den bisherigen)
async function elementPlanSetzen(eid,art,file){
  const e=elem(eid); if(!e||!ARTEN[art]||!pdfPruefen(file)) return null;
  const alt=e[feldVon(art)];
  const r=planHochladen(file,art,e.objektId,await file.arrayBuffer());
  patch('elemente',e.id,{[feldVon(art)]:r.planId});
  if(alt) planFreigeben(alt,e.id);
  return r;
}

/* Viele Pläne auf einmal. Der Dateiname ist normalerweise genau die Bezeichnung aus Enventa,
   z. B. "H4C Andermatt, C5.106.001, Typ 6.4.3, Bad Typ B6.G (WC), 6.OG.pdf".
   Reihenfolge der Prüfung: Betriebsauftrag im Namen > gleicher Name > Name enthält Bezeichnung > Nasszelle + Klammerteil. */
function planVorschlag(name,els){
  const fn=norm(String(name).replace(/\.pdf$/i,''));
  const wert=e=>{
    let s=0;
    if(e.barcode&&fn.includes(norm(e.barcode))) s+=100;
    const bez=norm(e.bezeichnung), voll=norm(elText(e)), post=norm(e.postext);
    if(fn&&(fn===bez||fn===voll||fn===post)) s+=80;
    else if([bez,voll,post].some(x=>x.length>=10&&fn.includes(x))) s+=60;
    else if(fn.length>=10&&[bez,voll,post].some(x=>x.includes(fn))) s+=40;
    const nz=norm(e.pos||nasszelleIn(e.bezeichnung));
    if(nz.length>=4&&fn.includes(nz)){
      s+=20;
      const kl=/\(([^)]*)\)/.exec(e.bezeichnung||'');
      if(kl){ const k=norm(kl[1]); if(k&&fn.includes(k)) s+=5+k.length; }
      const typ=/Bad Typ\s*([A-Z0-9.]+)/i.exec(e.bezeichnung||'');
      if(typ&&fn.includes(norm(typ[1]))) s+=2;
    }
    return s;
  };
  const r=els.map(e=>({e,s:wert(e)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
  if(!r.length) return {e:null,sicher:false};
  return {e:r[0].e,sicher:r.length===1||r[0].s>r[1].s};
}
async function massenUpload(files,art){
  const o=obj(S.aktivObjekt); if(!o){ toast('Zuerst ein Objekt wählen'); return; }
  const pdfs=files.filter(pdfPruefen); if(!pdfs.length) return;
  const els=elementeVon(o.id);
  if(!els.length){ toast('Dieses Objekt hat noch keine Elemente. Zuerst die Excel importieren.'); return; }
  const vs=pdfs.map(f=>planVorschlag(f.name,els));
  const opt=sel=>`<option value="">nicht zuordnen</option>`+els.map(e=>`<option value="${e.id}" ${sel&&sel.id===e.id?'selected':''}>${h(elText(e))} · ${h(e.barcode)}</option>`).join('');
  const nOk=vs.filter(v=>v.e&&v.sicher).length;
  const zeilen=pdfs.map((f,i)=>{
    const v=vs[i]; const ersetzt=v.e&&plan(v.e[feldVon(art)]);
    const st=!v.e?'<span class="zu-nein">kein Treffer</span>':v.sicher?'<span class="zu-ok">passt</span>':'<span class="zu-pruefen">bitte prüfen</span>';
    return `<tr><td>${h(f.name)}${ersetzt?`<br><small class="leer">ersetzt ${h(ersetzt.name)}</small>`:''}</td><td><select name="f_${i}">${opt(v.e)}</select></td><td>${st}</td></tr>`;
  }).join('');
  const r=await dialog(`${MEHRZAHL[art]} zuordnen`,`<p><b>${nOk} von ${pdfs.length}</b> Datei${pdfs.length>1?'en':''} automatisch zugeordnet. Bei Bedarf ändern, dann «Hochladen».</p>
    <table class="zu-tab"><thead><tr><th>Datei</th><th>Element</th><th></th></tr></thead><tbody>${zeilen}</tbody></table>`,{ok:'Hochladen',breit:true});
  if(!r) return;
  const laeufe=[]; const doppelt=new Set();
  for(let i=0;i<pdfs.length;i++){
    const eid=r.data[`f_${i}`]; if(!eid) continue;
    if(doppelt.has(eid)){ toast(`${pdfs[i].name}: Element wurde schon einer anderen Datei zugeordnet, übersprungen`); continue; }
    doppelt.add(eid);
    const x=await elementPlanSetzen(eid,art,pdfs[i]); if(x) laeufe.push(x.done);
  }
  renderAll();
  if(laeufe.length){ toast(`${laeufe.length} ${laeufe.length>1?MEHRZAHL[art]:ARTEN[art]} werden hochgeladen`); Promise.all(laeufe).then(()=>toast(`${laeufe.length} ${laeufe.length>1?MEHRZAHL[art]:ARTEN[art]} hochgeladen`),()=>{}); }
}

/* ---------- Excel-Import «Planung Betriebsaufträge» aus Enventa ---------- */
function excelDatum(v){
  if(v==null||v==='') return '';
  if(typeof v==='number'&&v>20000) return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);
  const m=/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})/.exec(String(v).trim());
  if(m){ const y=m[3].length===2?'20'+m[3]:m[3]; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  return /^\d{4}-\d{2}-\d{2}/.test(String(v))?String(v).slice(0,10):'';
}
// "Kunden-Auftrag: …\nKunde: …\nProjekt: …\nPostext: \nH4C Andermatt, C5.105.001, Typ 6.4.3, Bad Typ B6.G (WC), 6.OG"
function parseBeschreibung(txt){
  const zeilen=String(txt||'').replace(/\r/g,'').split('\n'); const r={}; let post=null;
  for(const z of zeilen){
    if(post!==null){ if(z.trim()) post.push(z.trim()); continue; }
    const m=/^\s*([^:]{2,30}):\s*(.*)$/.exec(z);
    if(!m) continue;
    const k=m[1].trim().toLowerCase();
    if(k==='postext'){ post=m[2].trim()?[m[2].trim()]:[]; continue; }
    r[k]=m[2].trim();
  }
  r.postext=(post||[]).join(' ');
  return r;
}
// Nasszellen-Nr. irgendwo im Text, z. B. "C5.105.001" (Buchstabe(n), Zahl, mindestens ein Punkt mit Zahl)
function nasszelleIn(t){ const m=/(?<![A-Za-z0-9])([A-Za-z]{1,3}\d+(?:\.\d+){1,3})(?![\d.]*\d)/.exec(t||''); return m?m[1]:''; }
// Die Bezeichnung bleibt genau wie in Enventa, die Nasszelle wird nur zusätzlich herausgelesen
function teilePostext(t){ const b=String(t||'').trim(); return {pos:nasszelleIn(b),bezeichnung:b}; }
async function importExcel(file){
  if(typeof XLSX==='undefined'){ toast('Excel-Bibliothek nicht geladen. Internet prüfen und Seite neu laden.'); return; }
  let rows;
  try{
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});
  }catch(err){ console.error(err); toast('Die Datei konnte nicht gelesen werden'); return; }
  const kopf=rows.findIndex(r=>r.some(c=>String(c).trim().toLowerCase()==='betriebsauftrag'));
  if(kopf<0){ await dialog('Import nicht möglich','<p>In der Datei fehlt die Spalte «Betriebsauftrag». Bitte in Enventa die Liste «Planung Betriebsaufträge» exportieren.</p>',{ok:'OK',info:true}); return; }
  const col={};
  rows[kopf].forEach((c,i)=>{ const k=String(c).trim().toLowerCase(); if(k&&!(k in col)) col[k]=i; });
  const w=(r,k)=>col[k]==null?'':r[col[k]];
  // 1. Zeilen lesen
  const zeilen=[];
  for(const r of rows.slice(kopf+1)){
    const ba=String(w(r,'betriebsauftrag')).trim();
    if(!/^\d{4,}$/.test(ba)) continue;
    const b=parseBeschreibung(w(r,'beschreibung'));
    const t=teilePostext(b.postext);
    zeilen.push({ba,b,t,r,auftragNr:String(w(r,'dokument')||b['kunden-auftrag']||'').trim()||'ohne Auftrag',lief:excelDatum(w(r,'lieferdatum'))});
  }
  if(!zeilen.length){ toast('Keine Zeilen mit Betriebsauftrag gefunden'); return; }
  // 2. Ziel wählen: Objekt (automatisch nach Auftragsnr. oder ein bestehendes) und optional ein Unterordner
  // Vorschlag: das Objekt und der Unterordner, die gerade offen sind. Erst ohne offenes Objekt nach Auftragsnr. suchen.
  const offen=obj(S.aktivObjekt);
  const offenOrdner=offen&&(offen.ordner||[]).find(x=>x.id===S.aktivOrdner);
  const schonDa=zeilen.map(z=>elem('ba_'+z.ba)).filter(Boolean);
  const vorschlag=offen||(schonDa[0]&&obj(schonDa[0].objektId))||findeObjekt(zeilen[0].auftragNr);
  const projekt=String(w(zeilen[0].r,'projektname')||zeilen[0].b.projekt||'').trim();
  const ordnerNamen=[...new Set(S.objekte.flatMap(o=>(o.ordner||[]).map(x=>x.name)))];
  const obs=[...S.objekte].sort((a,b)=>String(a.name).localeCompare(String(b.name),'de',{numeric:true}));
  const ziel=await dialog('Excel importieren',`<p><b>${zeilen.length} Element${zeilen.length>1?'e':''}</b> in «${h(file.name)}»${projekt?`, Projekt ${h(projekt)}`:''}.</p>
    <div class="feld-gitter">
      <label class="feld voll"><span>In welches Objekt?</span><select name="ziel">
        <option value="__auto" ${vorschlag?'':'selected'}>Automatisch nach Auftragsnummer${vorschlag?'':` (neues Objekt «${h(projekt||zeilen[0].auftragNr)}»)`}</option>
        ${obs.map(o=>`<option value="${o.id}" ${vorschlag&&vorschlag.id===o.id?'selected':''}>${h(o.name)}${o.auftragNr?` · Auftrag ${h(o.auftragNr)}`:''}</option>`).join('')}
      </select></label>
      <label class="feld voll"><span>Unterordner (optional, z. B. Haus A)</span><input name="ordner" list="ordnerVorschlaege" value="${h(offenOrdner?offenOrdner.name:'')}" placeholder="leer lassen = kein Unterordner" autocomplete="off">
        <datalist id="ordnerVorschlaege">${ordnerNamen.map(n=>`<option value="${h(n)}">`).join('')}</datalist></label>
    </div>
    ${(()=>{ const woanders=schonDa.filter(e=>!vorschlag||e.objektId!==vorschlag.id); const o2=woanders[0]&&obj(woanders[0].objektId);
      return woanders.length?`<p class="hinweis">${woanders.length} dieser Elemente sind bereits im Objekt «${h(o2?o2.name:'?')}»${o2&&o2.auftragNr?` (Auftrag ${h(o2.auftragNr)})`:''}. Sie werden ins gewählte Objekt verschoben, ihre Pläne und Fotos kommen mit.</p>`:''; })()}
    <p class="leer">Gleiche Betriebsaufträge werden aktualisiert, nicht doppelt angelegt. Pläne, Anzahl, Status und Fotos bleiben erhalten.</p>`,{ok:'Importieren'});
  if(!ziel) return;
  const festesObjekt=ziel.data.ziel!=='__auto'?obj(ziel.data.ziel):null;
  const ordnerName=String(ziel.data.ordner||'').trim();
  // 3. Schreiben
  const auftraege=new Map(); let neu=0, aktualisiert=0;
  for(const z of zeilen){
    const key=festesObjekt?festesObjekt.id:z.auftragNr;
    if(!auftraege.has(key)){
      let o;
      if(festesObjekt) o=festesObjekt;
      else{
        const x={id:objektIdFuer(z.auftragNr),auftragNr:z.auftragNr,
          name:String(w(z.r,'projektname')||z.b.projekt||'').trim()||'Auftrag '+z.auftragNr,
          kunde:String(w(z.r,'firma 1')||z.b.kunde||'').trim()};
        if(z.lief) x.lieferdatum=z.lief;
        const vorh=obj(x.id); if(!vorh) x.created=Date.now();
        anlegen('objekte',x,vorh||{strasse:'',plzOrt:'',lieferdatum:''}); o=obj(x.id);
      }
      auftraege.set(key,{o,n:0,ordnerId:ordnerName?ordnerFinden(o,ordnerName):''});
    }
    const a=auftraege.get(key); a.n++;
    const x={id:'ba_'+z.ba,objektId:a.o.id,barcode:z.ba,auftragNr:z.auftragNr,fixpos:String(w(z.r,'fixpos')||z.b['positions-nr']||'').trim(),
      pos:z.t.pos,bezeichnung:z.t.bezeichnung||String(w(z.r,'bezeichnung')).trim(),postext:z.b.postext,gewerk:String(w(z.r,'bezeichnung')).trim(),
      artikel:String(w(z.r,'artikel')).trim(),lieferdatum:z.lief};
    if(a.ordnerId) x.ordnerId=a.ordnerId;
    const vorh=elem(x.id);
    // Wechselt das Element das Objekt, ziehen seine Pläne mit
    if(vorh&&vorh.objektId!==a.o.id) Object.keys(ARTEN).forEach(art=>{ const pid=vorh[feldVon(art)]; if(plan(pid)) patch('plaene',pid,{objektId:a.o.id}); });
    if(vorh) aktualisiert++; else { neu++; x.anzahl=Math.max(1,Math.round(Number(w(z.r,'menge bestellt'))||1)); x.created=Date.now(); }
    anlegen('elemente',x,vorh||elemVorgabe());
  }
  const erster=[...auftraege.values()][0];
  S.aktivObjekt=erster.o.id; S.aktivOrdner=erster.ordnerId||'*'; S.aktivElement=null; S.auswahl.clear(); renderAll();
  const liste=[...auftraege.values()].map(a=>`<li><b>${h(a.o.name)}</b>${a.ordnerId?` › ${h(ordnerName)}`:''}: ${a.n} Element${a.n>1?'e':''}</li>`).join('');
  dialog('Import abgeschlossen',`<ul>${liste}</ul><p>${neu} neu, ${aktualisiert} aktualisiert.</p>`,{ok:'OK',info:true});
}
// Unterordner im Objekt suchen (gleicher Name) oder neu anlegen, gibt die ID zurück
function ordnerFinden(o,name){
  const vorh=(o.ordner||[]).find(x=>x.name.trim().toLowerCase()===name.trim().toLowerCase());
  if(vorh) return vorh.id;
  const neu={id:uid(),name:name.trim()};
  patch('objekte',o.id,{ordner:[...(o.ordner||[]),neu]});
  return neu.id;
}
function autoBarcode(o){
  const base=(o.auftragNr||'').replace(/\D/g,'')||String(Date.now()).slice(-6);
  let n=S.elemente.filter(e=>e.objektId===o.id).length+1, c;
  do{ c=base+String(n).padStart(4,'0'); n++; }while(S.elemente.some(e=>e.barcode===c));
  return c;
}
function fileToDataUrl(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsDataURL(file); }); }

/* ---------- Löschen ---------- */
function elementLoeschen(e){
  (e.fotos||[]).forEach(f=>delFile(f.id));
  const plaene=Object.keys(ARTEN).map(a=>e[feldVon(a)]).filter(Boolean);
  entferne('elemente',e.id); S.auswahl.delete(e.id);
  plaene.forEach(pid=>planFreigeben(pid,e.id));
}
function planLoeschenIntern(p){
  if(p.fileId) delFile(p.fileId);
  entferne('plaene',p.id);
  for(const e of S.elemente){
    const f={};
    for(const art of Object.keys(ARTEN)) if(e[feldVon(art)]===p.id) f[feldVon(art)]='';
    if(Object.keys(f).length) patch('elemente',e.id,f);
  }
}
function objektLoeschen(o){
  S.elemente.filter(x=>x.objektId===o.id).forEach(elementLoeschen);
  // Pläne, die noch ein Element in einem anderen Objekt braucht, bleiben stehen
  const gebraucht=new Set(S.elemente.filter(e=>e.objektId!==o.id).flatMap(e=>Object.keys(ARTEN).map(a=>e[feldVon(a)])));
  S.plaene.filter(x=>x.objektId===o.id&&!gebraucht.has(x.id)).forEach(planLoeschenIntern);
  entferne('objekte',o.id);
}

/* Pläne in der Monteur-Ansicht: laden, dann öffnen / senden / speichern */
const PLAN_CACHE=new Map(); // planId -> {status:'laedt'|'bereit'|'fehler', url, file, fertig, total, fehler}
function planKarte(p,titel,slot,planId){
  const el=$(slot); if(!el) return;
  if(!p&&planId){ el.innerHTML=`<div class="pk leer"><strong>${titel}</strong><span>Der zugewiesene ${titel} ist nicht in der Datenbank. Bitte im Büro beim Element neu hochladen.</span></div>`; return; }
  if(!p){ el.innerHTML=`<div class="pk leer"><strong>${titel}</strong><span>Diesem Element ist noch kein ${titel} zugewiesen.</span></div>`; return; }
  el.innerHTML=`<div class="pk" data-pk="${p.id}" data-pk-titel="${h(titel)}"></div>`;
  pkZeichnen(p.id);
  if(p.fileId&&!PLAN_CACHE.has(p.id)) planLaden(p.id);
}
function allePkZeichnen(){ $$('[data-pk]').forEach(el=>pkZeichnen(el.dataset.pk)); }
function pkZeichnen(id){
  const p=plan(id); const c=PLAN_CACHE.get(id);
  $$(`[data-pk="${id}"]`).forEach(el=>{
    if(!p){ el.innerHTML=''; return; }
    const titel=el.dataset.pkTitel;
    const kopf=`<div class="pk-text"><strong>${titel?h(titel):h(p.name)}</strong><span>${titel?h(p.name):(ARTEN[p.art]||'Plan')}${p.size?', '+kb(p.size):''}</span>`;
    if(!p.fileId){
      el.innerHTML=kopf+`</div>`+(p.url?`<div class="pk-akt"><a class="btn primary" href="${h(p.url)}" target="_blank" rel="noopener">PDF öffnen</a></div>`:'');
      return;
    }
    if(!c){
      el.innerHTML=kopf+(p.fertig===false?'<span class="pk-status">Upload im Büro läuft noch</span>':'')+`</div><div class="pk-akt"><button class="btn primary" data-pk-laden="${id}">PDF laden</button></div>`;
    }else if(c.status==='laedt'){
      const pr=c.total?Math.round(c.fertig/c.total*100):0;
      el.innerHTML=kopf+`<span class="pk-status">PDF wird geladen${c.total>1?`, ${c.fertig} von ${c.total} Teilen`:''}</span><div class="pk-balken"><i style="width:${Math.max(5,pr)}%"></i></div></div>`;
    }else if(c.status==='bereit'){
      const teilen=navigator.canShare&&c.file&&navigator.canShare({files:[c.file]});
      el.innerHTML=kopf+`</div><div class="pk-akt"><a class="btn primary" href="${c.url}" target="_blank" rel="noopener">PDF öffnen</a>${teilen?`<button class="btn" data-pk-teilen="${id}">Senden / Speichern</button>`:''}<a class="btn" href="${c.url}" download="${h(p.name)}">Herunterladen</a></div>`;
    }else{
      const txt={fehlt:'Die Datei ist nicht in der Datenbank. Der Upload im Büro wurde wohl nicht abgeschlossen, bitte dort neu hochladen.',unvollstaendig:'Die Datei ist unvollständig. Der Upload im Büro wurde wohl abgebrochen, bitte dort neu hochladen.',netz:'Keine Verbindung oder zu langsam. Bitte erneut versuchen.'}[c.fehler]||'Die Datei konnte nicht geladen werden.';
      el.innerHTML=kopf+`<span class="pk-status fehler">${txt}</span></div><div class="pk-akt"><button class="btn primary" data-pk-laden="${id}">Erneut versuchen</button></div>`;
    }
  });
}
async function planLaden(id){
  const p=plan(id); if(!p||!p.fileId) return;
  const alt=PLAN_CACHE.get(id); if(alt&&(alt.status==='laedt'||alt.status==='bereit')) return;
  PLAN_CACHE.set(id,{status:'laedt',fertig:0,total:0}); DATEI_FEHLER.delete(p.fileId); pkZeichnen(id);
  const f=await getFile(p.fileId);
  if(!f){ PLAN_CACHE.set(id,{status:'fehler',fehler:DATEI_FEHLER.get(p.fileId)||'netz'}); pkZeichnen(id); return; }
  const blob=new Blob([f.data],{type:'application/pdf'});
  let file=null; try{ file=new File([blob],p.name,{type:'application/pdf'}); }catch(e){}
  PLAN_CACHE.set(id,{status:'bereit',url:URL.createObjectURL(blob),file});
  pkZeichnen(id);
}
document.addEventListener('datei-fortschritt',ev=>{

  for(const p of S.plaene) if(p.fileId===id){ const c=PLAN_CACHE.get(p.id); if(c&&c.status==='laedt'){ c.fertig=fertig; c.total=total; pkZeichnen(p.id); } }
});
