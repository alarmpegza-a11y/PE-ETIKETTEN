async function komprimieren(file){
  try{
    const img=await createImageBitmap(file);
    const max=1600, f=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement('canvas'); c.width=Math.round(img.width*f); c.height=Math.round(img.height*f);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const b=await new Promise(res=>c.toBlob(res,'image/jpeg',0.8));
    return b||file;
  }catch(err){ return file; }
}
// Fotos nur mit Code (Einstellungen, Standard 8852). Einmal pro Gerät eingeben, ändert das Büro den Code, ist er neu nötig.
// Hinweis: Das ist eine Hürde gegen Fremde mit dem Link, kein echter Schutz (der Code steht in der Datenbank).
const fotoCodeSoll=()=>String(S.settings.fotoCode||'8852');
const fotoFrei=()=>LS.get('fotoCode')===fotoCodeSoll();
function fotoCodePruefen(){
  const i=$('#fotoCode'); const v=(i&&i.value||'').trim();
  if(v!==fotoCodeSoll()){ toast('Code falsch'); if(i){ i.value=''; i.focus(); } return; }
  LS.set('fotoCode',v); toast('Freigeschaltet, jetzt Foto aufnehmen');
  const e=elem(S.scanElement); if(e) renderScanElement(e);
}
async function fotosHinzufuegen(files){
  const e=elem(S.scanElement); if(!e||!files.length) return;
  if(!fotoFrei()){ toast('Bitte zuerst den Code eingeben'); return; }
  const inp=$('#monteurName'); const von=(inp&&inp.value||'').trim();
  if(von) LS.set('monteur',von);
  toast('Fotos werden hochgeladen');
  const neu=[]; const laeufe=[];
  for(const f of files){
    if(!f.type||!f.type.startsWith('image/')) continue;
    const b=await komprimieren(f); const buf=await b.arrayBuffer();
    if(buf.byteLength>8*1048576){ toast(`${f.name} ist zu gross`); continue; }
    const {id,done}=putFile(`fotos/${e.id}/${uid()}.jpg`,f.name,b.type||'image/jpeg',buf);
    neu.push({id,ts:Date.now(),von}); laeufe.push(done);
  }
  if(!neu.length){ toast('Keine Bilddatei gefunden'); return; }
  e.fotos=[...(e.fotos||[]),...neu];
  fire(updateDoc(ref('elemente',e.id),{fotos:arrayUnion(...neu)}));
  renderScanElement(e);
  Promise.all(laeufe).then(()=>toast(`${neu.length} Foto${neu.length>1?'s':''} gespeichert`),()=>{});
}
async function fotoLoeschen(fid){
  const e=elem(S.scanElement); if(!e) return;
  const f=(e.fotos||[]).find(x=>x.id===fid); if(!f) return;
  if(!await bestaetigen('Foto entfernen?','Das Foto wird für alle Benutzer von diesem Element entfernt.','Entfernen')) return;
  e.fotos=e.fotos.filter(x=>x.id!==fid);
  fire(updateDoc(ref('elemente',e.id),{fotos:arrayRemove(f)}));
  delFile(fid); renderScanElement(e);
}


/* ---------- Fotos ansehen: Galerie pro Element (oder ganzer Auftrag) und Grossansicht ---------- */
const GAL_URLS=[]; const LB={bilder:[],i:0};
const elName=elText;
async function galerieOeffnen(ziel,startIdx=null){
  const objektweit=ziel.startsWith('objekt:');
  const els=objektweit?elementeVon(ziel.slice(7)):[elem(ziel)].filter(Boolean);
  const gruppen=els.map(e=>({e,fotos:(e.fotos||[]).slice().sort((a,b)=>(a.ts||0)-(b.ts||0))})).filter(g=>g.fotos.length);
  if(!gruppen.length){ toast('Noch keine Fotos'); return; }
  LB.bilder=[];
  gruppen.forEach(g=>g.fotos.forEach(f=>LB.bilder.push({e:g.e,f,url:null})));
  const titel=objektweit?`Fotos ${(obj(ziel.slice(7))||{}).name||''}`:`Fotos ${elName(gruppen[0].e)}`;
  let k=0;
  const html=`<div class="galerie">${gruppen.map(g=>`<h3>${h(elName(g.e))} <small class="leer">${h(g.e.gewerk||'')} · ${g.fotos.length} Foto${g.fotos.length>1?'s':''}</small></h3>
    <div class="gal-raster">${g.fotos.map(()=>{ const i=k++; return `<button type="button" data-lb="${i}" title="Vergrössern"><img data-gal="${i}" alt=""></button>`; }).join('')}</div>`).join('')}</div>`;
  const p=dialog(titel,html,{ok:'Schliessen',breit:true,info:true});
  // Bilder nachladen (erst aus dem Cache, sonst aus der Datenbank)
  const liste=LB.bilder;
  liste.forEach((b,i)=>getFile(b.f.id).then(d=>{
    if(!d||LB.bilder!==liste) return;
    b.url=galUrl(new Blob([d.data],{type:d.type||'image/jpeg'}));
    const img=$(`#dlg [data-gal="${i}"]`); if(img) img.src=b.url;
    if($('#lb').open&&LB.i===i) lbZeigen(i);
  }));
  if(startIdx!=null){ const e=gruppen[0].e; const f=(e.fotos||[])[startIdx]; const idx=LB.bilder.findIndex(b=>b.f===f); lbZeigen(idx<0?0:idx); }
  await p;
  if($('#lb').open) $('#lb').close();
  GAL_URLS.splice(0).forEach(u=>URL.revokeObjectURL(u)); LB.bilder=[];
}
function galUrl(blob){ const u=URL.createObjectURL(blob); GAL_URLS.push(u); return u; }
function lbZeigen(i){
  const n=LB.bilder.length; if(!n) return;
  LB.i=(i+n)%n; const b=LB.bilder[LB.i]; const d=$('#lb');
  const name=elName(b.e); const datei=name.replace(/[^A-Za-z0-9.-]+/g,'_')+'_'+(LB.i+1)+'.jpg';
  d.innerHTML=`<div class="lb">
    <div class="lb-kopf"><strong>${h(name)}</strong><span>${LB.i+1} / ${n}</span><span class="spacer"></span>
      ${b.url?`<a class="btn sm" href="${b.url}" download="${h(datei)}">Herunterladen</a>`:''}<button type="button" class="btn sm" data-lb-zu>Schliessen</button></div>
    <div class="lb-bild">${b.url?`<img src="${b.url}" alt="Montagefoto ${h(name)}">`:'<p>Foto wird geladen …</p>'}</div>
    <div class="lb-fuss">${b.f.ts?fmtTs(b.f.ts):''}${b.f.von?` · ${h(b.f.von)}`:''}</div>
    ${n>1?`<button type="button" class="lb-nav l" data-lb-nav="-1" aria-label="Vorheriges Foto">‹</button><button type="button" class="lb-nav r" data-lb-nav="1" aria-label="Nächstes Foto">›</button>`:''}
  </div>`;
  if(!d.open) d.showModal();
}
document.addEventListener('keydown',ev=>{
  if(!$('#lb').open) return;
  if(ev.key==='ArrowRight'){ ev.preventDefault(); lbZeigen(LB.i+1); }
  if(ev.key==='ArrowLeft'){ ev.preventDefault(); lbZeigen(LB.i-1); }
});

/* ---------- Produktion: Barcode scannen, Produktionsplan anzeigen ---------- */
// Der Handscanner tippt die Nummer ins Feld und drückt Enter. Der Plan erscheint in der Seite, das Feld ist sofort wieder bereit.
let pdUrl=null, pdLauf=0;
// Pro PC gespeichert: 'download' lädt das PDF nach jedem Scan herunter (Chrome öffnet es dann automatisch, siehe Anleitung)
const pdModus=()=>LS.get('pdModus','download');
function renderProduktion(){
  const box=$('#produktion');
  if(!$('#pdNr',box)){
    box.innerHTML=`<div class="pd">
      <header class="pd-kopf"><span class="tb-logo">${logoMarkup()}</span><h1>Produktion · Plan scannen</h1>
        <label class="pd-modus">Nach dem Scan <select data-pd-modus>
          <option value="download" ${pdModus()==='download'?'selected':''}>PDF herunterladen und öffnen</option>
          <option value="anzeigen" ${pdModus()==='anzeigen'?'selected':''}>nur hier anzeigen</option></select></label>
        ${syncBadge()}<a class="btn" href="#">Zur Verwaltung</a></header>
      <form class="pd-form" id="pdForm" autocomplete="off"><input id="pdNr" inputmode="numeric" placeholder="Betriebsauftrag scannen oder eintippen" aria-label="Betriebsauftrag"><button class="btn" type="submit">Plan öffnen</button></form>
      <div class="pd-info" id="pdInfo"><span>Barcode auf der Etikette scannen. Geht der Scanner nicht, die Nummer unter dem Barcode eintippen und Enter drücken.</span></div>
      <div class="pd-leer" id="pdLeer">Bereit zum Scannen</div>
      <iframe class="pd-pdf" id="pdPdf" title="Produktionsplan" hidden></iframe>
    </div>`;
    // Der PDF-Viewer holt sich beim Laden den Fokus. Zurück ins Feld, damit der nächste Scan dort landet.
    $('#pdPdf').addEventListener('load',()=>[50,400,1200].forEach(ms=>setTimeout(()=>{ const i=$('#pdNr'); if(i&&document.body.classList.contains('modus-prod')) i.focus(); },ms)));
  }
  syncStatus();
  setTimeout(()=>{ const i=$('#pdNr'); if(i) i.focus(); },0);
}
function pdLeer(text){ const fr=$('#pdPdf'), l=$('#pdLeer'); fr.hidden=true; fr.removeAttribute('src'); l.hidden=false; l.textContent=text; }
async function pdZeigen(eingabe){
  const nr=String(eingabe||'').replace(/\s+/g,''); const info=$('#pdInfo'), inp=$('#pdNr');
  if(!nr||!info) return;
  inp.value=''; inp.focus();
  const lauf=++pdLauf;
  const e=findeBA(nr);
  if(!e){ info.innerHTML=`<span class="gross">${h(nr)}</span><span class="fehler">Betriebsauftrag nicht gefunden. Ist die Excel dieses Auftrags importiert?</span>`; pdLeer('Kein Plan'); return; }
  const o=obj(e.objektId)||{};
  const kopf=`<span class="gross">${h(e.barcode)}</span><span><b>${h(elText(e))}</b><br>${h([e.gewerk,o.name].filter(Boolean).join(' · '))}</span><span class="spacer"></span>`;
  const p=plan(e.produktionPlanId);
  if(!p){ info.innerHTML=kopf+'<span class="fehler">Für dieses Element ist noch kein Produktionsplan hochgeladen.</span>'; pdLeer('Kein Produktionsplan'); return; }
  info.innerHTML=kopf+'<span>Plan wird geladen …</span>'; pdLeer('Plan wird geladen …');
  const f=p.fileId?await getFile(p.fileId):null;
  if(lauf!==pdLauf) return;
  if(!f){
    info.innerHTML=kopf+(p.url?`<a class="btn primary" href="${h(p.url)}" target="_blank" rel="noopener">Plan öffnen</a>`:'<span class="fehler">Der Plan konnte nicht geladen werden. Internet prüfen und nochmals scannen.</span>');
    pdLeer('Plan nicht verfügbar'); return;
  }
  if(pdUrl) URL.revokeObjectURL(pdUrl);
  pdUrl=URL.createObjectURL(new Blob([f.data],{type:'application/pdf'}));
  const fr=$('#pdPdf'); fr.src=pdUrl; fr.hidden=false; $('#pdLeer').hidden=true;
  const datei=`${e.barcode} ${p.name}`.replace(/[\\/:*?"<>|]+/g,'_');
  info.innerHTML=kopf+`<span>${h(p.name)}</span><a class="btn" href="${pdUrl}" target="_blank" rel="noopener">In neuem Tab</a><a class="btn" href="${pdUrl}" download="${h(datei)}">Herunterladen</a>`;
  if(pdModus()==='download'){ const a=document.createElement('a'); a.href=pdUrl; a.download=datei; document.body.appendChild(a); a.click(); a.remove(); }
  inp.focus();
}

/* ---------- Ereignisse ---------- */
document.addEventListener('click',ev=>{
  const t=ev.target;
  const act=t.closest('[data-act]');
  if(act&&ACT[act.dataset.act]){ ev.preventDefault(); ACT[act.dataset.act](act); return; }
  let vb;
  if((vb=t.closest('[data-pk-laden]'))){ planLaden(vb.dataset.pkLaden); return; }
  if((vb=t.closest('[data-pk-teilen]'))){ planTeilen(vb.dataset.pkTeilen); return; }
  if((vb=t.closest('[data-plan-zuweisen]'))){ const p=plan(vb.dataset.planZuweisen); if(p) planZuweisenDialog(p); return; }
  const oi=t.closest('[data-obj]');
  if(oi){ if(S.aktivObjekt!==oi.dataset.obj) S.aktivOrdner='*'; S.aktivObjekt=oi.dataset.obj; S.aktivElement=null; S.auswahl.clear(); renderAll(); return; }
  const oo=t.closest('[data-ordner]');
  if(oo){ S.aktivOrdner=oo.dataset.ordner; S.aktivElement=null; S.auswahl.clear(); renderAll(); return; }
  let b;
  if((b=t.closest('[data-el-edit]'))){ elementBearbeiten(b.dataset.elEdit); return; }
  if((b=t.closest('[data-el-scan]'))){ const e=elem(b.dataset.elScan); if(e){ S.scanElement=e.id; location.hash=hashFor(e); } return; }
  if((b=t.closest('[data-plan-dl]'))){ const p=plan(b.dataset.planDl); if(p) planHerunterladen(p); return; }
  if((b=t.closest('[data-plan-edit]'))){ const p=plan(b.dataset.planEdit); if(p) planLink(p); return; }
  if((b=t.closest('[data-plan-del]'))){ const p=plan(b.dataset.planDel); if(p) planLoeschen(p); return; }
  if((b=t.closest('[data-foto-del]'))){ fotoLoeschen(b.dataset.fotoDel); return; }
  if((b=t.closest('[data-galerie]'))){ galerieOeffnen(b.dataset.galerie,b.dataset.idx!=null?Number(b.dataset.idx):null); return; }
  if((b=t.closest('[data-lb]'))){ lbZeigen(Number(b.dataset.lb)); return; }
  if((b=t.closest('[data-lb-nav]'))){ lbZeigen(LB.i+Number(b.dataset.lbNav)); return; }
  if(t.closest('[data-lb-zu]')){ $('#lb').close(); return; }
  const row=t.closest('[data-row]');
  if(row&&!t.closest('button,input,a,label')) zeileWaehlen(row);
});
document.addEventListener('keydown',ev=>{
  const row=ev.target.closest&&ev.target.closest('[data-row]');
  if(row&&ev.target===row&&(ev.key==='Enter'||ev.key===' ')){ ev.preventDefault(); zeileWaehlen(row); }
  // Produktion: Scanner-Eingabe landet immer im Nummernfeld, auch wenn vorher etwas anderes angeklickt wurde
  if(document.body.classList.contains('modus-prod')&&/^\d$/.test(ev.key)){ const i=$('#pdNr'); if(i&&document.activeElement!==i) i.focus(); }
});
document.addEventListener('submit',ev=>{
  if(ev.target.id==='pdForm'){ ev.preventDefault(); pdZeigen($('#pdNr').value); }
  if(ev.target.id==='codeForm'){ ev.preventDefault(); fotoCodePruefen(); }
});
// PDF auf M, D oder P ziehen; Excel irgendwo ins Fenster ziehen
const zielZelle=ev=>ev.target.closest&&ev.target.closest('[data-pz]');
document.addEventListener('dragover',ev=>{
  if(document.body.classList.contains('modus-scan')||document.body.classList.contains('modus-prod')) return;
  if(!ev.dataTransfer||![...ev.dataTransfer.types].includes('Files')) return;
  ev.preventDefault();
  $$('.pz.drop').forEach(x=>x.classList.remove('drop'));
  const z=zielZelle(ev); if(z) z.classList.add('drop');
});
document.addEventListener('dragleave',ev=>{ const z=zielZelle(ev); if(z) z.classList.remove('drop'); });
document.addEventListener('drop',async ev=>{
  if(document.body.classList.contains('modus-scan')||document.body.classList.contains('modus-prod')) return;
  const files=ev.dataTransfer?[...ev.dataTransfer.files]:[]; if(!files.length) return;
  ev.preventDefault(); $$('.pz.drop').forEach(x=>x.classList.remove('drop'));
  const z=zielZelle(ev);
  if(z){ const [eid,art]=z.dataset.pz.split('|'); const r=await elementPlanSetzen(eid,art,files[0]); if(r){ renderAll(); toast(`${ARTEN[art]} wird hochgeladen`); r.done.then(()=>toast(`${ARTEN[art]} gespeichert`),()=>{}); } return; }
  const xl=files.find(f=>/\.(xlsx|xls|csv)$/i.test(f.name));
  if(xl){ importExcel(xl); return; }
  toast('PDF direkt auf M, D oder P beim Element ziehen');
});
function zeileWaehlen(row){
  S.aktivElement=row.dataset.row;
  $$('.el-tab tr.aktiv').forEach(r=>r.classList.remove('aktiv')); row.classList.add('aktiv');
  renderVorschau();
  if(matchMedia('(max-width:1320px)').matches) $('#vorschau').scrollIntoView({behavior:'smooth',block:'start'});
}
document.addEventListener('input',ev=>{
  if(ev.target.id==='monteurName') LS.set('monteur',ev.target.value.trim());
  if(ev.target.id==='objSuche') renderObjektListe();
  if(ev.target.matches('[data-layout]')&&layoutVorschau) layoutVorschau();
});
document.addEventListener('change',async ev=>{
  const t=ev.target;
  if(t.matches('[data-upload]')){
    const files=[...t.files]; t.value=''; massenUpload(files,t.dataset.upload);
  }else if(t.matches('[data-pd-modus]')){
    LS.set('pdModus',t.value); toast(t.value==='download'?'Pläne werden nach dem Scan heruntergeladen':'Pläne werden nur hier angezeigt'); const i=$('#pdNr'); if(i) i.focus();
  }else if(t.matches('[data-excel]')){
    const f=t.files[0]; t.value=''; if(f) importExcel(f);
  }else if(t.matches('[data-pz-file]')){
    const f=t.files[0]; t.value=''; const [eid,art]=t.dataset.pzFile.split('|');
    const r=await elementPlanSetzen(eid,art,f);
    if(r){ renderAll(); toast(`${ARTEN[art]} wird hochgeladen`); r.done.then(()=>toast(`${ARTEN[art]} gespeichert`),()=>{}); }
  }else if(t.matches('[data-verschieben]')){
    const o=obj(S.aktivObjekt); let ziel=t.value; t.value=''; if(!o||!ziel) return;
    if(ziel==='__neu'){
      const r=await dialog('Neuer Unterordner',`<div class="feld-gitter">${feld('name','Name','',{required:true,ph:'z. B. Haus A',voll:true})}</div>`,{ok:'Anlegen und verschieben'}); if(!r) return;
      const name=String(r.data.name||'').trim(); if(!name) return; ziel=ordnerFinden(o,name);
    }
    const ids=[...S.auswahl].filter(id=>elem(id)&&elem(id).objektId===o.id);
    ids.forEach(id=>patch('elemente',id,{ordnerId:ziel==='-'?'':ziel}));
    S.auswahl.clear(); renderAll(); toast(`${ids.length} Element${ids.length>1?'e':''} verschoben`);
  }else if(t.matches('[data-anz]')){
    const e=elem(t.dataset.anz); if(!e) return;
    const n=anz({anzahl:t.value}); t.value=n; patch('elemente',e.id,{anzahl:n}); renderObjekt(); renderVorschau();
  }else if(t.matches('[data-chk]')){
    t.checked?S.auswahl.add(t.dataset.chk):S.auswahl.delete(t.dataset.chk); updateAuswahlBtn();
  }else if(t.matches('[data-chk-all]')){
    const o=obj(S.aktivObjekt); if(!o) return;
    elementeImBlick(o).forEach(e=>t.checked?S.auswahl.add(e.id):S.auswahl.delete(e.id));
    $$('[data-chk]').forEach(c=>c.checked=t.checked); updateAuswahlBtn();
  }else if(t.matches('[data-foto]')){
    const files=[...t.files]; t.value=''; fotosHinzufuegen(files);
  }
});

function route(){
  const m=/^#e=([A-Za-z0-9_-]+)/.exec(location.hash);
  const q=/^#a=/.test(location.hash)?new URLSearchParams(location.hash.slice(1)):null;
  const b=/^#b=([^&]+)/.exec(location.hash);
  const prod=location.hash==='#produktion';
  const scan=!prod&&!!(m||q||b);
  document.body.classList.toggle('modus-scan',scan);
  document.body.classList.toggle('modus-prod',prod);
  if(!S.gestartet){
    if(scan) $('#scan').innerHTML=`<div class="sc">${scanKopf()}<p class="sc-fehler">Daten werden geladen</p></div>`;
    if(prod) $('#produktion').innerHTML=`<div class="pd-leer">Daten werden geladen</div>`;
    syncStatus(); return;
  }
  if(prod) renderProduktion();
  else if(scan){ window.scrollTo(0,0); b?renderScanBA(decodeURIComponent(b[1])):m?renderScan(m[1]):renderScanEnventa(q); }
  else{ renderAll(); }
  syncStatus();
}
window.addEventListener('hashchange',route);
window.addEventListener('popstate',route);
window.addEventListener('resize',debounce(fitSkala,120));

/* ---------- Start ---------- */
async function init(){
  applyLayout(); route();
  await DB.open();
  const auth=getAuth(fbApp);
  let gestartet=false;
  const los=()=>{ if(!gestartet){ gestartet=true; starteListener(); } };
  onAuthStateChanged(auth,user=>{
    angemeldet=!!user;
    if(user){ authFehler=null; if(gestartet&&zugriffFehler){ fehlerZurueck(); starteListener(); } else los(); }
  });
  signInAnonymously(auth).catch(err=>{
    authFehler=err.code||err.message; console.warn('Anonyme Anmeldung fehlgeschlagen:',authFehler); los();
  });
  setTimeout(los,20000);
}
init().catch(err=>{ console.error(err); syncFehler(err); });
